services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: meddemo
      POSTGRES_USER: meddemo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meddemo}
    # 本機 5432 常被 Homebrew Postgres 占用，對外開 5433
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddemo -d meddemo"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 背景工作佇列與處理進度
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      node.store.allow_mmap: "false"
      node.processors: "1"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:-meddemo-local-search}
    mem_limit: 1g
    cpus: 1
    ports:
      - "127.0.0.1:19201:9200"
    volumes:
      - searchdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  searchdata:
