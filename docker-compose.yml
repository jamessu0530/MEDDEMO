services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: meddemo
      POSTGRES_USER: meddemo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meddemo}
    # 本機 5432 常被 Homebrew Postgres 占用，對外開 5433
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddemo -d meddemo"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 背景工作佇列與處理進度
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
