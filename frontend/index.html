    <title>中化裕民業務 AI 助理</title>
    <!-- 選了深色、放大字體的話在畫面出來之前就掛上，不然打開時會先閃一下淺色底、標準大小；
         規則跟 src/lib/skin.ts、src/lib/text-size.ts 的 read() 一樣 -->
    <script>
      try {
        var skin = localStorage.getItem("meddemo:skin")
        if (skin === "dark" || skin === "mono") document.documentElement.dataset.skin = "dark"
        var textSize = localStorage.getItem("meddemo:text-size")
        if (textSize === "large" || textSize === "xlarge") document.documentElement.dataset.textSize = textSize
      } catch (e) {}
    </script>
