# 反向代理：/api 與 /health 轉給 FastAPI，其餘是 React 打包好的靜態檔
server {
    listen 80;
    root /usr/share/nginx/html;
    # 上傳錄音：Nginx 預設只收 1MB，放寬到跟後端 MAX_AUDIO_BYTES 一樣的 20MB
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # WebSocket：在線狀態與新訊息通知（backend/app/api/presence.py）。
    # 手機每 20 秒送一次心跳，連線不會閒置到 proxy_read_timeout
    location = /api/ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # 前端路由交給 React：任何網址重新整理都回 index.html
    location / {
        try_files $uri /index.html;
    }
}
