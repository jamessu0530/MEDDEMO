<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熊熊滾的座騎</title>
<style>
body { margin: 0; background: #F6F5F9; color: #1A1626; font-family: system-ui, "PingFang TC", sans-serif; }
main { padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { margin: 0 0 16px; color: #6E6A78; font-size: 14px; }
table { border-collapse: separate; border-spacing: 8px; }
th { font-size: 14px; text-align: left; vertical-align: middle; }
th small { display: block; font-weight: 400; color: #6E6A78; }
td { background: #fff; border-radius: 16px; padding: 8px; vertical-align: bottom; }
td .ride { display: inline-block; vertical-align: bottom; }
/*
 * 熊熊滾的動畫（components/mascot.tsx）。每個狀態一組，掛在 svg 的 class 上（.mascot-idle、.mascot-think…）。
 * 只有會動的那幾組用自己的外框當旋轉、縮放的基準；其餘維持畫布座標。
 */
.mascot { display: block; }
.mascot-body, .mascot-ear-l, .mascot-ear-r, .mascot-eyes, .mascot-mouth, .mascot-shadow,
.mascot-dot, .mascot-wave, .mascot-star, .mascot-load { transform-box: fill-box; }
.mascot-body { transform-origin: 50% 100%; }
.mascot-ear-l { transform-origin: 70% 85%; }
.mascot-ear-r { transform-origin: 30% 85%; }
.mascot-eyes, .mascot-shadow, .mascot-dot, .mascot-star, .mascot-load { transform-origin: 50% 50%; }
.mascot-mouth { transform-origin: 50% 0%; }

/* 連眨兩下 */
@keyframes mascot-blink { 0%, 42%, 47%, 52%, 100% { transform: scaleY(1); } 44.5%, 49.5% { transform: scaleY(.08); } }

/* 待機：呼吸、連眨兩下、右耳抖一下、左右看 */
.mascot-idle .mascot-body { animation: mascot-breathe 2.8s ease-in-out infinite; }
@keyframes mascot-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.022, .978); } }
.mascot-idle .mascot-eyes { animation: mascot-blink 5.6s infinite; }
.mascot-idle .mascot-ear-r { animation: mascot-idle-ear 5.6s ease-in-out infinite; }
@keyframes mascot-idle-ear { 0%, 62%, 78%, 100% { transform: rotate(0deg); } 66% { transform: rotate(18deg); } 70% { transform: rotate(-6deg); } 74% { transform: rotate(10deg); } }
.mascot-idle .mascot-face { animation: mascot-look 8.4s ease-in-out infinite; }
@keyframes mascot-look { 0%, 16%, 60%, 100% { transform: translateX(0); } 22%, 34% { transform: translateX(5px); } 40%, 54% { transform: translateX(-5px); } }

/* 打招呼：沒有手，用左右探頭加小跳，兩隻耳朵輪流擺 */
.mascot-hi .mascot-body { animation: mascot-hi-lean 1.5s ease-in-out infinite; }
@keyframes mascot-hi-lean {
  0%, 50%, 100% { transform: rotate(0deg) translateY(0) scale(1.04, .96); }
  25% { transform: rotate(-9deg) translateY(-8px) scale(.98, 1.03); }
  75% { transform: rotate(9deg) translateY(-8px) scale(.98, 1.03); }
}
.mascot-hi .mascot-ear-l { animation: mascot-hi-ear-l 1.5s ease-in-out infinite; }
.mascot-hi .mascot-ear-r { animation: mascot-hi-ear-r 1.5s ease-in-out infinite; }
@keyframes mascot-hi-ear-l { 0%, 50%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-16deg); } }
@keyframes mascot-hi-ear-r { 0%, 50%, 100% { transform: rotate(0deg); } 75% { transform: rotate(16deg); } }

/* 聆聽：歪頭、右耳豎起來、聲波進來 */
.mascot-listen .mascot-body { animation: mascot-listen-tilt 2.6s ease-in-out infinite; }
@keyframes mascot-listen-tilt { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(-10deg) scale(1.015, .985); } }
.mascot-listen .mascot-ear-r { animation: mascot-listen-ear 1.3s ease-in-out infinite; }
@keyframes mascot-listen-ear { 0%, 100% { transform: scale(1.14); } 50% { transform: scale(1.28) rotate(6deg); } }
.mascot-listen .mascot-eyes { animation: mascot-blink 4.6s infinite; }
.mascot-wave { opacity: 0; animation: mascot-listen-wave 1.5s ease-out infinite; }
.mascot-wave[data-n="2"] { animation-delay: .25s; }
@keyframes mascot-listen-wave { 0% { opacity: 0; transform: translateX(14px); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateX(-8px); } }

/* 思考：眼睛往上看、身體慢慢晃、想法泡泡一顆一顆冒 */
.mascot-think .mascot-body { animation: mascot-think-sway 3.2s ease-in-out infinite; }
@keyframes mascot-think-sway { 0%, 100% { transform: rotate(5deg); } 50% { transform: rotate(-3deg); } }
.mascot-dot { animation: mascot-think-dot 1.8s ease-in-out infinite; }
.mascot-dot[data-n="2"] { animation-delay: .25s; }
.mascot-dot[data-n="3"] { animation-delay: .5s; }
@keyframes mascot-think-dot { 0%, 100% { transform: scale(.35); opacity: .25; } 40%, 60% { transform: scale(1); opacity: 1; } }

/* 回答：嘴巴開合、身體跟著點 */
.mascot-talk .mascot-body { animation: mascot-talk-nod .84s ease-in-out infinite; }
@keyframes mascot-talk-nod { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.018, .982); } }
.mascot-talk .mascot-mouth { animation: mascot-talk-mouth .42s ease-in-out infinite alternate; }
@keyframes mascot-talk-mouth { from { transform: scale(.7, .25); } to { transform: scale(1, 1); } }
.mascot-talk .mascot-eyes { animation: mascot-blink 3.8s infinite; }

/* 等待：左右腳輪流踏步，耳朵跟著擺，頭上三顆點輪流跳 */
.mascot-wait .mascot-body { animation: mascot-wait-step 1s ease-in-out infinite; }
@keyframes mascot-wait-step {
  0%, 100% { transform: rotate(-6deg) translateY(0); } 25%, 75% { transform: rotate(0deg) translateY(-5px); }
  50% { transform: rotate(6deg) translateY(0); }
}
.mascot-wait .mascot-ear-l { animation: mascot-wait-ear 1s ease-in-out infinite; }
.mascot-wait .mascot-ear-r { animation: mascot-wait-ear 1s ease-in-out infinite reverse; }
@keyframes mascot-wait-ear { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.mascot-wait .mascot-eyes { animation: mascot-blink 4.2s infinite; }
.mascot-load { animation: mascot-wait-load 1.2s ease-in-out infinite; }
.mascot-load[data-n="2"] { animation-delay: .2s; }
.mascot-load[data-n="3"] { animation-delay: .4s; }
@keyframes mascot-wait-load { 0%, 60%, 100% { transform: translateY(0) scale(.75); opacity: .5; } 30% { transform: translateY(-9px) scale(1); opacity: 1; } }

/* 完成：蓄力下壓 → 跳起拉長 → 落地壓扁 → 回彈；耳朵慢半拍；星星彈出來 */
.mascot-yay .mascot-all { animation: mascot-yay-jump 1.6s cubic-bezier(.4, 0, .25, 1) infinite; }
@keyframes mascot-yay-jump { 0%, 22%, 62%, 100% { transform: translateY(0); } 40% { transform: translateY(-34px); } }
.mascot-yay .mascot-body { animation: mascot-yay-squash 1.6s cubic-bezier(.4, 0, .25, 1) infinite; }
@keyframes mascot-yay-squash {
  0%, 100% { transform: scale(1, 1); } 16% { transform: scale(1.13, .86); } 40% { transform: scale(.92, 1.09); }
  62% { transform: scale(1.15, .85); } 74% { transform: scale(.97, 1.04); } 86% { transform: scale(1.02, .985); }
}
.mascot-yay .mascot-shadow { animation: mascot-yay-shadow 1.6s cubic-bezier(.4, 0, .25, 1) infinite; }
@keyframes mascot-yay-shadow { 0%, 22%, 62%, 100% { transform: scale(1); opacity: .13; } 40% { transform: scale(.62); opacity: .06; } }
.mascot-yay .mascot-ear-l { animation: mascot-yay-ear-l 1.6s ease-in-out infinite; }
.mascot-yay .mascot-ear-r { animation: mascot-yay-ear-r 1.6s ease-in-out infinite; }
@keyframes mascot-yay-ear-l { 0%, 30%, 90%, 100% { transform: rotate(0deg); } 44% { transform: rotate(18deg); } 66% { transform: rotate(-20deg); } 78% { transform: rotate(8deg); } }
@keyframes mascot-yay-ear-r { 0%, 30%, 90%, 100% { transform: rotate(0deg); } 44% { transform: rotate(-18deg); } 66% { transform: rotate(20deg); } 78% { transform: rotate(-8deg); } }
.mascot-star { animation: mascot-yay-star 1.6s ease-out infinite; }
.mascot-star[data-n="2"], .mascot-star[data-n="4"] { animation-delay: .08s; }
.mascot-star[data-n="3"] { animation-delay: .16s; }
@keyframes mascot-yay-star {
  0%, 30% { transform: scale(0) rotate(-30deg); opacity: 0; } 46% { transform: scale(1.2) rotate(0deg); opacity: 1; }
  70% { transform: scale(1) rotate(12deg); opacity: 1; } 100% { transform: scale(.4) rotate(30deg); opacity: 0; }
}

/* 騎乘：坐在座騎上，笑到瞇起來、張嘴；身體不另外動，由座騎晃（components/rides/ride.css） */

/* 系統設定「減少動態效果」：停在該狀態的表情，不動。道具原本靠動畫才顯現，這時直接顯示 */
@media (prefers-reduced-motion: reduce) {
  .mascot, .mascot * { animation: none !important; }
  .mascot-wave { opacity: 1; }
}

/*
 * 座騎的動畫（components/rides）。共用的 class 都在這裡；各縣市自己的寫在 vehicles/<縣市>.css，以 ride-<縣市>- 開頭。
 * 只用 transform 與 opacity；減少動態效果或 .ride-still 時全部停住。
 */
.ride { display: block; overflow: visible; }
.ride-spin, .ride-roll, .ride-bob, .ride-sway, .ride-bounce, .ride-float, .ride-hop, .ride-swim, .ride-slide, .ride-step {
  transform-box: fill-box;
}

/* 輪子轉、整顆特產滾 */
.ride-spin { transform-origin: center; animation: ride-spin 1s linear infinite; }
.ride-roll { transform-origin: center; animation: ride-spin 2.2s linear infinite; }
@keyframes ride-spin { to { transform: rotate(360deg); } }

/* 車身上下浮 */
.ride-bob { animation: ride-bob .45s ease-in-out infinite alternate; }
@keyframes ride-bob { to { transform: translateY(-3px); } }

/* 以底部為軸左右晃（站在東西上保持平衡） */
.ride-sway { transform-origin: 50% 100%; animation: ride-sway 1.1s ease-in-out infinite alternate; }
@keyframes ride-sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }

/* 走路踏步 */
.ride-step { transform-origin: 50% 100%; animation: ride-step .5s ease-in-out infinite alternate; }
@keyframes ride-step { from { transform: rotate(-5deg); } to { transform: rotate(5deg) translateY(-4px); } }

/* 彈：落地壓扁、彈起拉長 */
.ride-bounce { transform-origin: 50% 100%; animation: ride-bounce .7s cubic-bezier(.3, 0, .4, 1) infinite; }
@keyframes ride-bounce {
  0%, 100% { transform: translateY(0) scale(1.08, .92); }
  45% { transform: translateY(-22px) scale(.95, 1.05); }
}

/* 飄：慢慢上下、輕輕擺 */
.ride-float { transform-origin: 50% 50%; animation: ride-float 2.4s ease-in-out infinite alternate; }
@keyframes ride-float { from { transform: translateY(4px) rotate(-3deg); } to { transform: translateY(-8px) rotate(3deg); } }

/* 跳：一格一格往前跳（回到原位再跳，畫面上看起來在原地連跳） */
.ride-hop { transform-origin: 50% 100%; animation: ride-hop .6s ease-in-out infinite; }
@keyframes ride-hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-26px); } }

/* 游：上下起伏、頭尾擺 */
.ride-swim { transform-origin: 50% 50%; animation: ride-swim 1.2s ease-in-out infinite; }
@keyframes ride-swim {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-6px) rotate(4deg); }
}

/* 滑：往前傾、身體拉長 */
.ride-slide { transform-origin: 30% 100%; animation: ride-slide .9s ease-in-out infinite alternate; }
@keyframes ride-slide { from { transform: rotate(-6deg) translateX(-4px); } to { transform: rotate(-12deg) translateX(6px); } }

/* 風：從右往左吹過去 */
.ride-wind { animation: ride-wind 1.3s linear infinite; }
.ride-wind:nth-of-type(2) { animation-delay: -.45s; }
.ride-wind:nth-of-type(3) { animation-delay: -.9s; }
@keyframes ride-wind { 0% { transform: translateX(30px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(-30px); opacity: 0; } }

.ride-still, .ride-still * { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  .ride, .ride * { animation: none !important; }
}

/*
 * 彰化縣（肉圓）的座騎動畫，都以底邊中間為軸：
 * 開車整台 Q 彈地壓扁、拉長；走路是跳跳床：熊落下時肉圓被壓扁，接著回彈把熊送上去（兩個動畫同一個節拍 .9s）。
 */
.ride-changhua-jiggle, .ride-changhua-jump, .ride-changhua-squash { transform-box: fill-box; transform-origin: 50% 100%; }

.ride-changhua-jiggle { animation: ride-changhua-jiggle .8s ease-in-out infinite; }
@keyframes ride-changhua-jiggle {
  0%, 100% { transform: scale(1.04, .94); }
  50% { transform: translateY(-4px) scale(.97, 1.05); }
}

/* 熊：0% 踩到最低（肉圓壓到最扁），接著被彈上去，50% 最高，落回來 */
.ride-changhua-jump { animation: ride-changhua-jump .9s infinite; }
@keyframes ride-changhua-jump {
  0%, 100% { transform: translateY(12px) scale(1.06, .92); animation-timing-function: ease-out; }
  12% { transform: translateY(-4px) scale(.96, 1.05); animation-timing-function: cubic-bezier(.2, .6, .4, 1); }
  50% { transform: translateY(-40px) scale(1, 1); animation-timing-function: cubic-bezier(.6, 0, .8, .4); }
  88% { transform: translateY(2px) scale(.98, 1.03); animation-timing-function: ease-in; }
}

/* 肉圓：熊踩下來時壓扁，放開後回彈、晃兩下停住，等熊再落下 */
.ride-changhua-squash { animation: ride-changhua-squash .9s infinite; }
@keyframes ride-changhua-squash {
  0%, 100% { transform: scale(1.1, .8); animation-timing-function: ease-out; }
  14% { transform: scale(.95, 1.08); animation-timing-function: ease-in-out; }
  28% { transform: scale(1.03, .97); animation-timing-function: ease-in-out; }
  40%, 88% { transform: scale(1, 1); animation-timing-function: ease-in; }
}

/* 新北市（平溪天燈）的座騎動畫：火苗一閃一閃；纜車的每盞天燈以頂上的夾頭為軸輕輕晃，用 nth-of-type 錯開 */
.ride-new-taipei-flame, .ride-new-taipei-swing { transform-box: fill-box; }
.ride-new-taipei-flame { transform-origin: 50% 100%; animation: ride-new-taipei-flame .3s ease-in-out infinite alternate; }
@keyframes ride-new-taipei-flame {
  from { transform: scale(.86, .78); opacity: .75; }
  to { transform: scale(1.06, 1.1); opacity: 1; }
}
.ride-new-taipei-swing { transform-origin: 50% 0; animation: ride-new-taipei-swing 1.6s ease-in-out infinite alternate; }
.ride-new-taipei-swing:nth-of-type(2) { animation-delay: -.5s; }
.ride-new-taipei-swing:nth-of-type(3) { animation-delay: -1s; }
@keyframes ride-new-taipei-swing { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

/*
 * 台中市（珍珠奶茶）的座騎動畫：走路時地上的珍珠一格一格往左移（一格 54），跟 ride-hop 同一個節拍（.6s），
 * 只在熊跳在空中時移；最左邊那顆邊移邊縮小不見，最右邊在原地長出一顆新的，落地時看起來跟開始一模一樣。
 * 沒有動畫時（減少動態效果、still）新的那顆藏起來。
 */
.ride-taichung-row, .ride-taichung-out, .ride-taichung-in { transform-box: fill-box; transform-origin: center; }
.ride-taichung-row { animation: ride-taichung-row .6s ease-in-out infinite; }
@keyframes ride-taichung-row {
  0%, 12% { transform: translateX(0); }
  88%, 100% { transform: translateX(-54px); }
}
.ride-taichung-out { animation: ride-taichung-out .6s ease-in-out infinite; }
@keyframes ride-taichung-out {
  0%, 12% { transform: translateX(0) scale(1); opacity: 1; }
  50%, 100% { transform: translateX(-27px) scale(0); opacity: 0; }
}
.ride-taichung-in { transform: scale(0); opacity: 0; animation: ride-taichung-in .6s ease-in-out infinite; }
@keyframes ride-taichung-in {
  0%, 50% { transform: scale(0); opacity: 0; }
  88%, 100% { transform: scale(1); opacity: 1; }
}

/* 台北市（小籠包）的座騎動畫：蒸氣往上飄、淡掉。兩縷放同一組，用 nth-of-type 錯開時間 */
.ride-taipei-steam { transform-box: fill-box; animation: ride-taipei-steam 1.6s ease-out infinite; }
.ride-taipei-steam:nth-of-type(2) { animation-delay: -.8s; }
@keyframes ride-taipei-steam {
  0% { transform: translateY(6px); opacity: 0; }
  35% { opacity: 1; }
  100% { transform: translateY(-10px); opacity: 0; }
}

</style>
