<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>油墨轉場試玩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --page: #F3F2F6;
    --surface: #FFFFFF;
    --text: #1A1626;
    --text-2: #6E6A78;
    --line: #E3DFEA;
    --chip: #ECE9F2;
    --sel-bg: #1A1626;
    --sel-fg: #FFFFFF;
    --bezel: #1A1626;
    --focus: #9B51E0;
    --sans: 'IBM Plex Sans', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #121016;
      --surface: #1B1822;
      --text: #F1EEF6;
      --text-2: #A49FB1;
      --line: #2F2A3A;
      --chip: #282432;
      --sel-bg: #F1EEF6;
      --sel-fg: #1A1626;
      --bezel: #322D3D;
      --focus: #B98AF0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #121016;
    --surface: #1B1822;
    --text: #F1EEF6;
    --text-2: #A49FB1;
    --line: #2F2A3A;
    --chip: #282432;
    --sel-bg: #F1EEF6;
    --sel-fg: #1A1626;
    --bezel: #322D3D;
    --focus: #B98AF0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1020px;
    margin-inline: auto;
    padding-inline: 16px;
    padding-block: 28px 44px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .top .eyebrow { margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--text-2); }
  .top h1 { margin: 2px 0 6px; font-size: 26px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
  .top .lede { margin: 0; color: var(--text-2); max-width: 38em; }

  .stage { display: grid; grid-template-columns: 376px minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 820px) { .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; } }

  .phone {
    width: 376px; max-width: 100%;
    padding: 8px; border-radius: 40px; background: var(--bezel);
    box-shadow: 0 18px 40px -18px rgba(26, 22, 38, .45);
  }
  .screen {
    position: relative; width: 100%;
    height: clamp(580px, calc(100svh - 190px), 720px);
    border-radius: 32px; overflow: hidden; background: #F6F5F9; isolation: isolate;
  }
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

  /* 控制面板 */
  .panel {
    width: 100%; min-width: 0;
    display: flex; flex-direction: column; gap: 20px;
    padding: 20px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--line);
  }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend, .lbl { padding: 0; margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; color: var(--text-2); display: block; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--chip); color: var(--text); font-weight: 500; cursor: pointer;
  }
  .seg input:checked + span { background: var(--sel-bg); color: var(--sel-fg); }
  .seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1px solid rgba(255, 255, 255, .45); }
  .sw-purple { background: #9B51E0; }
  .sw-mono { background: linear-gradient(90deg, #121212 0 34%, #8E8E8C 34% 67%, #F4F4F2 67%); }
  .desc { margin: 10px 0 0; color: var(--text); max-width: 34em; }
  .desc small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--text-2); }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer; }
  .chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--sel-bg); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
  input[type="range"] { width: 100%; margin: 0; accent-color: var(--sel-bg); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .btn {
    font: inherit; font-weight: 500; cursor: pointer;
    padding: 9px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  .btn.primary { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
  .btn[aria-pressed="true"] { background: var(--chip); border-color: var(--text-2); }
  .btn:focus-visible, input[type="range"]:focus-visible, .chk input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .notes { margin: 0; padding: 16px 0 0 18px; border-top: 1px solid var(--line); color: var(--text-2); font-size: 13px; }
  .notes li + li { margin-top: 4px; }
  #dbg { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--text); }

  /* 手機裡的 App 畫面：照 frontend/src/index.css 的配色；data-skin 決定紫色或黑白灰 */
  .layer {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.45;
    --bg: #F6F5F9; --fg: #1A1626; --card: #FFFFFF; --primary: #9B51E0; --primary-fg: #FFFFFF;
    --secondary: #F1EEF6; --muted: #EDEAF3; --muted-fg: #6E6A78; --accent: #E2CDF7; --border: #E6E2EC;
    --warning: #A97400; --destructive: #B04226;
  }
  .layer[data-skin="mono"] {
    --bg: #F4F4F2; --fg: #121212; --card: #FFFFFF; --primary: #121212; --primary-fg: #FFFFFF;
    --secondary: #ECECEA; --muted: #E7E7E4; --muted-fg: #6A6A68; --accent: #D6D6D3; --border: #DEDEDA;
  }
  :where(.layer) :where(button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
  .layer button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .m-head { display: flex; align-items: center; gap: 4px; min-height: 54px; padding: 6px 16px; border-bottom: 1px solid var(--border); }
  .m-head.has-back { padding-left: 4px; }
  .m-back { display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 10px; color: var(--muted-fg); }
  .m-head p { margin: 0; font-size: 12px; color: var(--muted-fg); }
  .m-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .m-body { flex: 1; min-height: 0; overflow: hidden auto; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .m-sec { margin: 6px 0 0; font-size: 12px; color: var(--muted-fg); }
  .m-hero { display: flex; flex-direction: column; gap: 2px; padding: 16px; border-radius: 16px; background: var(--primary); color: var(--primary-fg); }
  .m-hero .k { font-size: 12px; opacity: .85; }
  .m-hero strong { font-size: 19px; font-weight: 600; }
  .m-hero .s { font-size: 12.5px; opacity: .85; }
  .m-hero .cta { align-self: flex-start; display: flex; align-items: center; gap: 4px; margin-top: 12px; padding: 8px 14px; border-radius: 10px; background: var(--primary-fg); color: var(--primary); font-weight: 600; }
  .m-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
  .m-row .tx { flex: 1; min-width: 0; }
  .m-row b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-row small { display: block; font-size: 12px; color: var(--muted-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-row .go { color: var(--muted-fg); flex: none; display: flex; }
  .m-num, .m-ava, .m-tile { flex: none; display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; font-weight: 600; }
  .m-num { border-radius: 50%; background: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .m-ava { border-radius: 50%; background: var(--accent); color: var(--fg); }
  .m-tile { border-radius: 10px; background: var(--secondary); color: var(--primary); }
  .m-tag { flex: none; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--secondary); color: var(--muted-fg); }
  .m-tag.warn { color: var(--warning); font-weight: 600; }
  .m-badge { flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--destructive); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .m-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--muted); color: var(--muted-fg); }
  .m-ask { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .m-ask h3 { margin: 10px 0 4px; font-size: 20px; font-weight: 600; }
  .m-q { width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
  .m-dock { margin-top: auto; display: flex; align-items: center; gap: 10px; }
  .m-dock .in { flex: 1; padding: 12px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); color: var(--muted-fg); }
  .m-mic { flex: none; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--primary); color: var(--primary-fg); box-shadow: 0 0 0 6px var(--accent); }
  .m-promo { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
  .m-promo .hd { display: flex; align-items: center; gap: 10px; }
  .m-promo .off { flex: none; padding: 3px 9px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font-weight: 600; font-size: 13px; }
  .m-promo b { font-weight: 600; }
  .m-promo small { font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .m-bar { height: 6px; border-radius: 3px; background: var(--muted); overflow: hidden; }
  .m-bar i { display: block; height: 100%; border-radius: 3px; background: var(--primary); }
  .m-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .m-stat { padding: 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
  .m-stat small { display: block; font-size: 11.5px; color: var(--muted-fg); }
  .m-stat b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .m-stat b.warn { color: var(--warning); }
  .m-btn { display: flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border-radius: 12px; font-weight: 600; background: var(--primary); color: var(--primary-fg); }
  .m-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .m-btn.sec { background: var(--secondary); color: var(--fg); font-weight: 500; }
  .m-nav { display: flex; border-top: 1px solid var(--border); background: var(--card); }
  .m-nav button { flex: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--muted-fg); }
  .m-nav button.on { color: var(--primary); font-weight: 500; }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">中化裕民業務 AI 助理 · 頁面切換動畫</p>
    <h1>油墨轉場試玩</h1>
    <p class="lede">點手機裡的分頁或卡片就會換頁，墨從你點的位置出來。右邊換效果、換配色、調速度，也可以拖進度條一格一格看。</p>
  </header>

  <main class="stage">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="layer" id="layerA" data-skin="purple"></div>
        <div class="layer" id="layerB" data-skin="purple" style="visibility:hidden"></div>
        <canvas id="ink" aria-hidden="true"></canvas>
      </div>
    </div>

    <section class="panel" aria-label="動畫設定">
      <fieldset>
        <legend>效果（點了會播一次）</legend>
        <div class="seg">
          <label><input type="radio" name="fx" id="fx-bleed" value="bleed" checked><span>墨暈</span></label>
          <label><input type="radio" name="fx" id="fx-spray" value="spray"><span>噴漆</span></label>
          <label><input type="radio" name="fx" id="fx-splat" value="splat"><span>潑墨</span></label>
          <label><input type="radio" name="fx" id="fx-brush" value="brush"><span>刷痕</span></label>
        </div>
        <p class="desc" id="fxDesc"></p>
      </fieldset>

      <fieldset>
        <legend>配色（點了會用墨把整個畫面換色）</legend>
        <div class="seg">
          <label><input type="radio" name="skin" id="skin-purple" value="purple" checked><span><i class="sw sw-purple"></i>紫色（現在）</span></label>
          <label><input type="radio" name="skin" id="skin-mono" value="mono"><span><i class="sw sw-mono"></i>黑白灰</span></label>
        </div>
        <label class="chk"><input type="checkbox" id="alt"> 每次換頁順便換配色</label>
      </fieldset>

      <div class="two">
        <fieldset>
          <legend>墨的顏色</legend>
          <div class="seg">
            <label><input type="radio" name="inkc" id="ink-auto" value="auto" checked><span>跟著配色</span></label>
            <label><input type="radio" name="inkc" id="ink-black" value="black"><span>固定黑</span></label>
            <label><input type="radio" name="inkc" id="ink-purple" value="purple"><span>固定紫</span></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>速度</legend>
          <div class="seg">
            <label><input type="radio" name="spd" id="spd-half" value="0.5"><span>0.5×</span></label>
            <label><input type="radio" name="spd" id="spd-one" value="1" checked><span>1×</span></label>
            <label><input type="radio" name="spd" id="spd-fast" value="1.6"><span>1.6×</span></label>
          </div>
        </fieldset>
      </div>

      <div>
        <label class="lbl" for="scrub">進度（拖著看每一格，放開會自己播完）</label>
        <input type="range" id="scrub" min="0" max="1000" value="0">
        <div class="row">
          <button type="button" class="btn primary" id="play">播放一次</button>
          <button type="button" class="btn" id="auto" aria-pressed="false">自動輪播</button>
        </div>
        <label class="chk"><input type="checkbox" id="reduce"> 模擬手機開了「減少動態效果」</label>
      </div>

      <ul class="notes">
        <li>四種效果都是墨蓋滿整個畫面的那一刻才換頁。</li>
        <li>這裡故意放慢讓大家看清楚；App 裡每種效果多長寫在上面的說明裡。</li>
        <li>黑白灰只換主色、背景和邊框；帳齡的琥珀色、未讀的紅點照舊。</li>
        <li>手機開了「減少動態效果」的人不會看到墨，直接換頁。</li>
      </ul>
      <div id="dbg"></div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var screenEl = $('#screen'), canvas = $('#ink'), scrub = $('#scrub');
  var layers = [$('#layerA'), $('#layerB')];

  /* ---------- 手機裡的畫面 ---------- */
  var ICON = {
    calendar: '<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 3v3M16 3v3M3 9.5h18"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5M16 4.7a3.5 3.5 0 0 1 0 6.6M18.5 14.8c1.7.9 2.7 2.6 3 5.2"/>',
    messages: '<path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M20 10a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2h-.5V21l-3.2-2.5H13"/>',
    ask: '<path d="M12 3.5c4.7 0 8.5 3.4 8.5 7.7s-3.8 7.7-8.5 7.7c-1 0-2-.2-2.9-.5L4 20.5l1.3-3.9a7.3 7.3 0 0 1-1.8-5.4c0-4.3 3.8-7.7 8.5-7.7z"/><path d="M9.8 9.3a2.3 2.3 0 1 1 3.3 2.1c-.7.4-1.1.9-1.1 1.6M12 15.6v.1"/>',
    percent: '<circle cx="12" cy="12" r="9"/><path d="M9 15l6-6"/><circle cx="9.2" cy="9.2" r="1"/><circle cx="14.8" cy="14.8" r="1"/>',
    chev: '<path d="M9 5.5l6.5 6.5L9 18.5"/>',
    back: '<path d="M15 5.5L8.5 12l6.5 6.5"/>',
    mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
    hash: '<path d="M9.5 4L8 20M16 4l-1.5 16M4.5 9h16M3.5 15h16"/>'
  };
  function svg(name, size) {
    size = size || 20;
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }
  var TABS = [
    { id: 'today', label: '今日', icon: 'calendar' },
    { id: 'customers', label: '客戶', icon: 'users' },
    { id: 'channels', label: '頻道', icon: 'messages' },
    { id: 'ask', label: '問答', icon: 'ask' },
    { id: 'promos', label: '促銷', icon: 'percent' }
  ];
  function nav(active) {
    return '<nav class="m-nav">' + TABS.map(function (t) {
      return '<button type="button" data-go="' + t.id + '"' + (t.id === active ? ' class="on" aria-current="page"' : '') + '>' + svg(t.icon) + '<span>' + t.label + '</span></button>';
    }).join('') + '</nav>';
  }
  function head(title, sub, back) {
    return '<header class="m-head' + (back ? ' has-back' : '') + '">' +
      (back ? '<button type="button" class="m-back" data-go="' + back + '" aria-label="返回">' + svg('back') + '</button>' : '') +
      '<div>' + (sub ? '<p>' + sub + '</p>' : '') + '<h2>' + title + '</h2></div></header>';
  }
  function stop(n, name, time, tag, warn) {
    return '<button type="button" class="m-row" data-go="detail"><span class="m-num">' + n + '</span><span class="tx"><b>' + name + '</b><small>' + time + '</small></span><span class="m-tag' + (warn ? ' warn' : '') + '">' + tag + '</span></button>';
  }
  function cust(name, note) {
    return '<button type="button" class="m-row" data-go="detail"><span class="m-ava">' + name.charAt(0) + '</span><span class="tx"><b>' + name + '</b><small>' + note + '</small></span><span class="go">' + svg('chev', 16) + '</span></button>';
  }
  function chan(name, last, time, unread) {
    return '<button type="button" class="m-row" data-go="detail"><span class="m-tile">' + svg('hash', 18) + '</span><span class="tx"><b>' + name + '</b><small>' + last + '</small></span>' +
      (unread ? '<span class="m-badge">' + unread + '</span>' : '<span class="m-tag">' + time + '</span>') + '</button>';
  }
  function promo(off, title, period, done, total) {
    return '<div class="m-promo"><div class="hd"><span class="off">' + off + '</span><b>' + title + '</b></div><small>' + period + ' · 已談 ' + done + ' / ' + total + ' 家</small><div class="m-bar"><i style="width:' + Math.round(done / total * 100) + '%"></i></div></div>';
  }
  var detailFrom = 'today';
  var PAGES = {
    today: function () {
      return head('今日路線', '9 月 30 日 星期三') + '<div class="m-body">' +
        '<button type="button" class="m-hero" data-go="detail"><span class="k">下一站 · 10:30</span><strong>康和藥局 永和店</strong><span class="s">距離 1.2 公里 · 上次拜訪 9/24</span><span class="cta">開始拜訪 ' + svg('chev', 16) + '</span></button>' +
        '<p class="m-sec">接下來 4 家</p>' +
        stop(2, '仁安藥局', '11:20', '帳齡 45 天', true) +
        stop(3, '日安藥師藥局 中和店', '13:30', '魚油檔期 10/5 截止') +
        stop(4, '德昌藥局', '14:40', '新品鋪貨') +
        stop(5, '安心藥局 景安店', '16:00', '補樣品') +
        '</div>' + nav('today');
    },
    customers: function () {

    spray: { dur: 1500, app: '1.40', use: '設定頁換配色', desc: '噴頭來回六趟把畫面蓋滿，邊緣是一顆一顆的漆霧；蓋滿後整片漆往下流走，留下幾條慢一點的漆痕。' },
    splat: { dur: 1250, app: '0.95', use: '登入、登出', desc: '墨從點的位置炸開，帶著放射的墨刺和飛濺的墨點，另外六團接著落下；蓋滿後縮成一顆顆墨珠消失。' },
    brush: { dur: 1150, app: '0.78', use: '進入或返回內頁', desc: '五道刷子左右交錯刷過去，前緣是乾筆的毛邊、刷痕裡有淡色的筆觸；刷子離開後露出新的一頁。' },
    // 減少動態效果：不播，直接換頁
    fade: { dur: 1 }
  };
  function rgb(hex) { return [(hex >> 16 & 255) / 255, (hex >> 8 & 255) / 255, (hex & 255) / 255]; }
  var INK = {
    purple: { col: rgb(0x9B51E0), deep: rgb(0x6A2BBE), wash: rgb(0xC9A2F5) },
    mono: { col: rgb(0x141414), deep: rgb(0x4A4A48), wash: rgb(0xA8A8A5) }
  };
  var S = { page: 'today', skin: 'purple', fx: 'bleed', speed: 1, ink: 'auto', alt: false, reduce: false, front: 0, tr: null, pending: null, auto: false, timer: 0 };

  function inkColors(from, to) {
    if (S.ink === 'black') return { a: INK.mono.col, b: INK.mono.deep, wa: INK.mono.wash, wb: INK.mono.wash };
    if (S.ink === 'purple') return { a: INK.purple.col, b: INK.purple.deep, wa: INK.purple.wash, wb: INK.purple.wash };
    return { a: INK[from].col, b: from === to ? INK[from].deep : INK[to].col, wa: INK[from].wash, wb: INK[to].wash };
  }
  function other(skin) { return skin === 'purple' ? 'mono' : 'purple'; }
  function makeTr(fx, o, from, to) {
    var W = screenEl.clientWidth, H = screenEl.clientHeight;
    return {
      fx: fx, o: o, t: 0, last: 0, held: false,
      maxD: Math.max(Math.hypot(o[0], o[1]), Math.hypot(W - o[0], o[1]), Math.hypot(o[0], H - o[1]), Math.hypot(W - o[0], H - o[1])),
      seed: [Math.random(), Math.random()], cols: inkColors(from, to)
    };
  }

  function begin(page, skin, origin, held) {
    var inc = layers[1 - S.front], out = layers[S.front];
    if (page === 'detail' && S.page !== 'detail') detailFrom = S.page;
    renderInto(inc, page, skin);
    inc.style.zIndex = 2; out.style.zIndex = 1;
    inc.style.visibility = 'hidden'; inc.style.opacity = ''; inc.style.clipPath = '';
    if (R) R.resize();
    var tr = makeTr(S.reduce || !R ? 'fade' : S.fx, origin || [screenEl.clientWidth / 2, screenEl.clientHeight * .42], S.skin, skin);
    tr.page = page; tr.skin = skin; tr.held = !!held;
    S.tr = tr;
    apply(0);
    if (!held) requestAnimationFrame(tick);
  }
  function apply(t) {
    var tr = S.tr, inc = layers[1 - S.front];
    scrub.value = Math.round(t * 1000);
    if (tr.fx === 'fade') { inc.style.visibility = 'visible'; inc.style.opacity = t; return; }
    R.draw(tr, t);
    inc.style.visibility = t >= .5 ? 'visible' : 'hidden';
  }
  function tick(now) {
    var tr = S.tr;
    if (!tr || tr.held) return;
    if (!tr.last) tr.last = now;
    var dt = Math.min(now - tr.last, 50); tr.last = now;
    tr.t = Math.min(1, tr.t + dt / (tr.fx === 'fade' ? FXD.fade.dur : FXD[tr.fx].dur / S.speed));
    apply(tr.t);
    if (tr.t >= 1) finish(); else requestAnimationFrame(tick);
  }
  function finish() {
    var tr = S.tr, inc = layers[1 - S.front], out = layers[S.front];
    inc.style.visibility = 'visible'; inc.style.clipPath = ''; inc.style.opacity = '';
    out.style.visibility = 'hidden'; out.innerHTML = '';
    S.front = 1 - S.front; S.page = tr.page; S.skin = tr.skin; S.tr = null;
    if (R) R.clear();
    scrub.value = 0;
    $('#skin-' + S.skin).checked = true;
    if (S.pending) { var p = S.pending; S.pending = null; go(p.page, p.opts); }
    else if (S.auto) S.timer = setTimeout(playNext, 800);
  }
  function resume() {
    var tr = S.tr;
    if (!tr || !tr.held) return;
    tr.held = false; tr.last = 0;
    if (tr.t >= 1) finish(); else requestAnimationFrame(tick);
  }
  function go(page, opts) {
    opts = opts || {};
    if (S.tr) { S.pending = { page: page, opts: opts }; resume(); return; }
    var skin = opts.skin || (S.alt ? other(S.skin) : S.skin);
    if (page === S.page && skin === S.skin) return;
    begin(page, skin, opts.origin, opts.held);
  }
  function tabOrigin(id) {
    var b = $('.m-nav [data-go="' + id + '"]', layers[S.front]);
    var sr = screenEl.getBoundingClientRect();
    if (!b) return [sr.width / 2, sr.height - 28];
    var r = b.getBoundingClientRect();
    return [r.left + r.width / 2 - sr.left, r.top + r.height / 2 - sr.top];
  }
  function nextTab() {
    var i = TABS.findIndex(function (t) { return t.id === S.page; });
    return TABS[(i + 1) % TABS.length].id;
  }
  function playNext(held) {
    var id = nextTab();
    go(id, { origin: tabOrigin(id), held: held === true });
  }
  function stopAuto() {
    S.auto = false; clearTimeout(S.timer);
    $('#auto').setAttribute('aria-pressed', 'false');
    $('#auto').textContent = '自動輪播';
  }

  /* ---------- 操作 ---------- */
  screenEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (!b) return;
    var sr = screenEl.getBoundingClientRect();
    var x = e.clientX - sr.left, y = e.clientY - sr.top;
    if (e.detail === 0) { var r = b.getBoundingClientRect(); x = r.left + r.width / 2 - sr.left; y = r.top + r.height / 2 - sr.top; }
    go(b.dataset.go, { origin: [x, y] });
  });
  function showDesc() {
    var d = FXD[S.fx];
    $('#fxDesc').innerHTML = d.desc + '<small>App 裡用在' + d.use + '，整段 ' + d.app + ' 秒。這裡的 1× 放慢成 ' + (d.dur / 1000).toFixed(2) + ' 秒。</small>';
  }
  document.querySelectorAll('input[name="fx"]').forEach(function (el) {
    el.addEventListener('change', function () { S.fx = el.value; showDesc(); playNext(); });
  });
  document.querySelectorAll('input[name="skin"]').forEach(function (el) {
    el.addEventListener('change', function () { go(S.tr ? S.tr.page : S.page, { skin: el.value }); });
  });
  document.querySelectorAll('input[name="inkc"]').forEach(function (el) {
    el.addEventListener('change', function () { S.ink = el.value; });
  });
  document.querySelectorAll('input[name="spd"]').forEach(function (el) {
    el.addEventListener('change', function () { S.speed = parseFloat(el.value); });
  });
  $('#alt').addEventListener('change', function (e) { S.alt = e.target.checked; });
  $('#reduce').addEventListener('change', function (e) { S.reduce = e.target.checked; });
  $('#play').addEventListener('click', function () { playNext(); });
  $('#auto').addEventListener('click', function () {
    if (S.auto) { stopAuto(); return; }
    S.auto = true;
    this.setAttribute('aria-pressed', 'true'); this.textContent = '停止輪播';
    if (!S.tr) playNext();
  });
  scrub.addEventListener('input', function () {
    var t = scrub.value / 1000;
    if (!S.tr) { stopAuto(); playNext(true); }
    if (S.tr) { S.tr.held = true; S.tr.t = t; apply(t); }
  });
  scrub.addEventListener('change', resume);
  if (R && window.ResizeObserver) new ResizeObserver(function () { if (!S.tr) { R.resize(); R.clear(); } }).observe(screenEl);

  /* ---------- 開場 ---------- */
  S.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('#reduce').checked = S.reduce;
  // 表單的值在重新發佈後會被保留，照目前勾選的狀態還原
  S.fx = ($('input[name="fx"]:checked') || {}).value || 'bleed';
  S.ink = ($('input[name="inkc"]:checked') || {}).value || 'auto';
  S.speed = parseFloat(($('input[name="spd"]:checked') || {}).value || '1');
  S.alt = $('#alt').checked;
  S.skin = ($('input[name="skin"]:checked') || {}).value || 'purple';
  renderInto(layers[0], S.page, S.skin);
  showDesc();
  if (R) { R.resize(); R.clear(); }
  else $('#dbg').textContent = '這個瀏覽器開不了 WebGL，所以這裡看不到墨，只會直接換頁。';

  /* ---------- 檢查用（網址加 ?sheet 或 ?fx=spray&t=0.4，發佈後不會用到） ---------- */
  var Q = new URLSearchParams(location.search);
  if (R && Q.has('fx')) {
    S.fx = Q.get('fx'); S.alt = Q.get('to') === 'mono';
    playNext(true);
    S.tr.seed = [.37, .81]; S.tr.t = parseFloat(Q.get('t') || '.4'); apply(S.tr.t);
  }
  if (R && Q.has('sheet')) {
    var gl = R.gl, times = [.08, .2, .32, .44, .5, .58, .7, .82, .94];
    var W = screenEl.clientWidth, H = screenEl.clientHeight;
    var sheet = document.createElement('div');
    sheet.style.cssText = 'position:fixed;inset:0;z-index:99;background:#ddd;overflow:auto;padding:8px;display:grid;grid-template-columns:repeat(' + times.length + ',max-content);gap:4px;align-content:start';
    var log = [], px = new Uint8Array(canvas.width * canvas.height * 4);
    S.ink = 'auto';
    Object.keys(FRAG).forEach(function (fx) {
      times.forEach(function (t) {
        var tr = makeTr(fx, [W * .7, H - 28], 'purple', 'mono');
        tr.seed = [.37, .81];
        R.draw(tr, t);
        var cv = document.createElement('canvas'); cv.width = 118; cv.height = Math.round(118 * H / W);
        var cx = cv.getContext('2d');
        cx.fillStyle = t >= .5 ? '#FFFFFF' : '#E9DDF8'; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(canvas, 0, 0, cv.width, cv.height);
        sheet.appendChild(cv);
        // 換頁那一刻墨一定要是不透明的，不然會看到頁面跳一下
        if (t === .5) {
          gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
          var min = 255;
          for (var j = 3; j < px.length; j += 4) min = Math.min(min, px[j]);
          log.push(fx + ' t=' + t + ' 全畫面最小 alpha=' + min);
        }
      });
    });
    var pre = document.createElement('pre');
    pre.style.cssText = 'grid-column:1/-1;margin:0;font:11px/1.35 Menlo,monospace;color:#000';
    pre.textContent = log.join('\n');
    sheet.appendChild(pre);
    document.body.appendChild(sheet);
    R.clear();
  }
})();
</script>
</html>
