# 部署流程用 --set image.tag=<commit SHA> 指定這次的版本，每一版都對得回原始碼
image:
  api: ghcr.io/jamessu0530/meddemo-api
  web: ghcr.io/jamessu0530/meddemo-web
  tag: latest
  # GHCR 是私有的，映像由部署流程用短期 token 先拉進 K3s；這裡不能設 Always，否則 pod 會自己去映像庫拉而失敗
  pullPolicy: IfNotPresent

# Grafana Cloud Metrics。部署流程在四個監控 Secrets 都齊全時自動啟用。
# Alloy 跟 API 在同一個 Pod，僅抓 localhost；不需要叢集讀取權限。
monitoring:
  enabled: false
  secretName: meddemo-monitoring
  environment: production
  alloyImage: grafana/alloy:v1.20.1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# 對外網址：Cloudflare（橘雲）→ K3s 內建的 Traefik → web（Nginx）
ingress:
  host: meddemo.jamessu2016.com

db:
  image: pgvector/pgvector:0.8.0-pg16
  storage: 5Gi

redis:
  image: redis:8.10.1-alpine

elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5

# 程式參數（用哪家服務、哪個模型）：改這裡、commit、推 main 就會部署生效，跟 CARE-infra 的 values.yaml 一樣。
# 這裡寫什麼鍵，ConfigMap 就產生同名的環境變數，新增參數不必改模板。留空＝用程式裡的預設值。
# 金鑰不放這裡，放 GitHub Secrets（見下面的 secrets）。
config:
  # 展示時讓新人自行略過課程；正式使用設 false，前後端都恢復五關解鎖。
  DEMO_SKIP_LEARNING: "true"
  # 每個登入帳號都可切換業務／主管／IT 示範身分；正式使用設 false。
  DEMO_ROLE_SWITCH: "true"
  # 語音辨識。留空＝不辨識，錄音改走手動輸入逐字稿
  ASR_PROVIDER: gemini
  ASR_MODEL: ""
  # CARE 的語音辨識服務（faster-whisper），跟 MEDDEMO 在同一個 K3s 叢集，沒有 NetworkPolicy 擋，跨 namespace 直接連得到。
  # ASR_PROVIDER 是 gemini 時它當備援；改成 local 就換它當主要來源（字錯率比 Gemini 高，見 README「語音辨識」）
  ASR_URL: http://local-asr.care-dev.svc.cluster.local:8200
  # 華語／台語自動辨識；金鑰另放 GitHub Secret TAIGI_API_KEY，沒設時僅華語來源可用。
  TAIGI_BASE_URL: https://learn-language.tokyo
  # AI 模型：抽欄位、數字查詢、知識查詢共用；語音問答查資料也靠它
  LLM_PROVIDER: gemini
  LLM_MODEL: ""
  # 語意檢索。留空＝gemini-embedding-2：文字、照片、PDF 在同一個向量空間，拿照片找得到文件、拿文字找得到照片。
  # 改回 gemini-embedding-001 只剩文字檢索，附件的向量與以圖找圖會失敗、退回關鍵字。
  # 這裡換模型之後文件段落要重算向量：手動執行部署並勾選「重灌假資料」（改 backend/app/embeddings.py 會自動重灌）
  EMBEDDING_PROVIDER: gemini
  EMBEDDING_MODEL: ""
  # 語音問答的 Live 模型。9/14 改用 3.1，沒先用語音實測驗證（為什麼要注意見 README 的語音問答段）；留空就回到程式預設的 2.5
  VOICE_MODEL: gemini-3.1-flash-live-preview
  # 主管頁地圖的 Map ID（Google Cloud Console → Map Management 建一個 JavaScript 的）。留空＝Google 給測試用的 DEMO_MAP_ID
  GOOGLE_MAPS_MAP_ID: ""

# 金鑰：Secret 由部署流程從 GitHub Secrets 建立，不放進 chart（跟 CARE 的 care-backend-secret 一樣）
secrets:
  # POSTGRES_PASSWORD
  database: meddemo-secrets
  # ASR_API_KEY、TAIGI_API_KEY、LLM_API_KEY、EMBEDDING_API_KEY、VOICE_API_KEY、GOOGLE_MAPS_SERVER_KEY、GOOGLE_MAPS_BROWSER_KEY；還沒建時照樣啟動，沒有金鑰的功能改走手動輸入或估算
  ai: meddemo-ai
