apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        # Nginx：放 React 打包好的網頁，並把 /api 轉給 FastAPI（設定在 frontend/nginx.conf）
        - name: nginx
          image: "{{ .Values.image.web }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
