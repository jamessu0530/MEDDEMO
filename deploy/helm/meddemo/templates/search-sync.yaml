{{- if .Values.elasticsearch.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: customer-search-sync
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: search-sync
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: {{ include "meddemo.apiImage" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "/srv/backend/scripts/sync_customer_search.py", "--index-only"]
              env:
                {{- include "meddemo.databaseEnv" . | nindent 16 }}
                {{- include "meddemo.searchEnv" . | nindent 16 }}
{{- end }}
