apiVersion: batch/v1
kind: CronJob
metadata:
  name: calendar-reminders
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: calendar
              image: {{ include "meddemo.apiImage" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "app.jobs.calendar"]
              env:
                {{- include "meddemo.databaseEnv" . | nindent 16 }}
              envFrom:
                {{- include "meddemo.aiEnvFrom" . | nindent 16 }}
