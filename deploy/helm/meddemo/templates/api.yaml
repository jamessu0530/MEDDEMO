apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        {{- include "meddemo.configChecksum" . | nindent 8 }}
        {{- if .Values.monitoring.enabled }}
        checksum/alloy: {{ include (print $.Template.BasePath "/alloy.yaml") . | sha256sum }}
        {{- end }}
    spec:
      containers:
        - name: api
          image: {{ include "meddemo.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "meddemo.databaseEnv" . | nindent 12 }}
            {{- include "meddemo.searchEnv" . | nindent 12 }}
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: GRAFANA_CLOUD_ENVIRONMENT
              value: {{ .Values.monitoring.environment | quote }}
            - name: GRAFANA_CLOUD_REFRESH_SECONDS
              value: {{ .Values.monitoring.intervalSeconds | quote }}
            {{- if .Values.monitoring.logs.enabled }}
            - name: REQUEST_LOG_PATH
              value: /var/log/meddemo/api.jsonl
            {{- end }}
            {{- if .Values.monitoring.enabled }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.monitoring.secretName }}
                  key: METRICS_TOKEN
            {{- end }}
          envFrom:
            {{- include "meddemo.aiEnvFrom" . | nindent 12 }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          {{- if .Values.monitoring.logs.enabled }}
          volumeMounts:
            - name: api-logs
              mountPath: /var/log/meddemo
          {{- end }}
        {{- if .Values.monitoring.enabled }}
        - name: alloy
          image: {{ .Values.monitoring.alloyImage | quote }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --disable-reporting
          envFrom:
            - secretRef:
                name: {{ .Values.monitoring.secretName }}
            {{- if .Values.monitoring.logs.enabled }}
            - secretRef:
                name: {{ .Values.monitoring.logs.secretName }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: alloy-http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: alloy-http
          resources:
            {{- toYaml .Values.monitoring.resources | nindent 12 }}
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
            - name: alloy-data
              mountPath: /var/lib/alloy
            {{- if .Values.monitoring.logs.enabled }}
            - name: api-logs
              mountPath: /var/log/meddemo
              readOnly: true
            {{- end }}
      volumes:
        - name: alloy-config
          configMap:
            name: meddemo-alloy
        - name: alloy-data
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.monitoring.logs.enabled }}
        - name: api-logs
          emptyDir:
            sizeLimit: 32Mi
        {{- end }}
        {{- end }}
