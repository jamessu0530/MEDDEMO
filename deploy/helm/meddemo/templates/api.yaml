apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        {{- include "meddemo.configChecksum" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "meddemo.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "meddemo.databaseEnv" . | nindent 12 }}
            - name: REDIS_URL
              value: redis://redis:6379/0
          envFrom:
            {{- include "meddemo.aiEnvFrom" . | nindent 12 }}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
