{{- if and .Values.monitoring.logs.enabled (not .Values.monitoring.enabled) }}
{{- fail "monitoring.logs.enabled requires monitoring.enabled" }}
{{- end }}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: meddemo-alloy
  labels:
    {{- include "meddemo.labels" . | nindent 4 }}
data:
  config.alloy: |
    logging {
      level = "warn"
    }

    prometheus.scrape "api" {
      targets = [{
        __address__ = "127.0.0.1:8000",
        instance = sys.env("POD_NAME"),
        namespace = sys.env("POD_NAMESPACE"),
        service = "meddemo-api",
        environment = {{ .Values.monitoring.environment | quote }},
      }]
      job_name = "meddemo/api"
      scrape_interval = {{ printf "%ds" (.Values.monitoring.intervalSeconds | int) | quote }}
      scrape_timeout = {{ printf "%ds" (max 1 (sub (.Values.monitoring.intervalSeconds | int) 1)) | quote }}
      bearer_token = sys.env("METRICS_TOKEN")
      forward_to = [prometheus.remote_write.grafana_cloud.receiver]
    }

    prometheus.remote_write "grafana_cloud" {
      endpoint {
        url = sys.env("GRAFANA_CLOUD_PROMETHEUS_URL")
        basic_auth {
          username = sys.env("GRAFANA_CLOUD_PROMETHEUS_USERNAME")
          password = sys.env("GRAFANA_CLOUD_TOKEN")
        }
        queue_config {
          batch_send_deadline = "1s"
        }
      }
      wal {
        truncate_frequency = "15m"
        min_keepalive_time = "5m"
        max_keepalive_time = "1h"
      }
    }
    {{- if .Values.monitoring.logs.enabled }}

    loki.source.file "api" {
      targets = [{
        __path__ = "/var/log/meddemo/api.jsonl",
        job = "meddemo/api",
        service_name = "meddemo-api",
        instance = sys.env("POD_NAME"),
        namespace = sys.env("POD_NAMESPACE"),
        environment = {{ .Values.monitoring.environment | quote }},
      }]
      file_match {
        enabled = true
        sync_period = "5s"
      }
      forward_to = [loki.process.api.receiver]
    }

    loki.process "api" {
      stage.json {
        expressions = { level = "level", timestamp = "timestamp" }
      }
      stage.timestamp {
        source = "timestamp"
        format = "RFC3339Nano"
      }
      stage.labels {
        values = { level = "" }
      }
      forward_to = [loki.write.grafana_cloud.receiver]
    }

    loki.write "grafana_cloud" {
      endpoint {
        url = sys.env("GRAFANA_CLOUD_LOKI_URL")
        basic_auth {
          username = sys.env("GRAFANA_CLOUD_LOKI_USERNAME")
          password = sys.env("GRAFANA_CLOUD_LOKI_TOKEN")
        }
      }
    }
    {{- end }}
{{- end }}
